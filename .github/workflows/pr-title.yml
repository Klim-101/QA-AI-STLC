name: Pull request title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      # The squash commit title is taken from the pull request title, so it must follow Conventional Commits.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            perf
            build
            ci
            chore
          scopes: |
            schemas
            core
            explorer
            runners
            cli
            mcp
            agents
            adapters
            demo
            repo
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: 'The summary must start with a lowercase letter and must not end with a period.'
