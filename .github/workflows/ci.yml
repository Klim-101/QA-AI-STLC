name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The explorer package's integration test drives a real Chromium against examples/demo-app
      # (AGENTS.md section 13); `--with-deps` also installs the OS packages Linux runners need.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      # Verifies .claude/rules and adapters/claude-plugin still match agents/ and AGENTS.md — the
      # only enforcement of "generated from one canonical source, never hand-edited" (section 3).
      - name: Lint generated files
        run: npm run lint:generated

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      # Coverage is only meaningfully comparable to one baseline, and posting from all three
      # matrix legs would triple the comment; ubuntu-latest is the fastest of the three.
      - name: Post coverage summary
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const rows = Object.entries(summary)
              .filter(([file]) => file !== 'total')
              .map(([file, stats]) => {
                const relative = path.relative(process.cwd(), file).split(path.sep).join('/');
                return `| ${relative} | ${stats.statements.pct}% | ${stats.branches.pct}% | ${stats.functions.pct}% | ${stats.lines.pct}% |`;
              })
              .join('\n');
            const total = summary.total;
            const marker = '<!-- coverage-summary -->';
            const body = [
              marker,
              '## Coverage summary',
              '',
              '| File | Statements | Branches | Functions | Lines |',
              '|---|---|---|---|---|',
              rows,
              `| **Total** | **${total.statements.pct}%** | **${total.branches.pct}%** | **${total.functions.pct}%** | **${total.lines.pct}%** |`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Build
        run: npm run build

  # P2-13: proves the generated plugin (adapters/claude-plugin/) installs correctly from a local
  # marketplace with the rest of the repository absent from disk. Windows and macOS only, per the
  # task's own "Done when" -- ubuntu-latest already gets full coverage from the `test` job above.
  # `@anthropic-ai/claude-code` is installed globally for this job's own use, never declared in
  # any package.json: the framework stays model-agnostic (AGENTS.md's "no LLM SDK dependency"
  # boundary is about the framework's own packages), and this job makes no model call -- it only
  # exercises `claude plugin`'s marketplace/install/list/details CLI mechanics.
  plugin-install-smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      # Only the root workspace's own devDependencies are needed (the smoke test script's
      # `cross-spawn`); no package needs building, since the script reads adapters/claude-plugin
      # and packages/mcp-server/package.json as plain files.
      - name: Install dependencies
        run: npm ci

      # npm's install-scripts opt-in (npm >=11) skips a global package's postinstall by default;
      # without it, @anthropic-ai/claude-code's postinstall (which places the real platform binary
      # behind the npm-generated `claude`/`claude.cmd` shim) never runs, and `claude` resolves to
      # nothing on disk (ENOENT) even though `npm install` itself reports success.
      - name: Install the Claude Code CLI
        # Deliberately not in any package.json -- AGENTS.md's no-LLM-SDK-dependency denylist
        # (scripts/check-llm-denylist.mjs) scans every package.json's dependency fields, so a
        # lockfile-tracked install here would trip it; the exact version is still pinned, and this
        # job's own runner is a throwaway CI VM, not a machine whose supply chain persists.
        run: | # zizmor: ignore[adhoc-packages] see above -- intentionally outside any lockfile
          npm install -g @anthropic-ai/claude-code@2.1.280 --allow-scripts=@anthropic-ai/claude-code

      - name: Run the plugin-install smoke test
        run: npm run smoke:plugin-install

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependency licenses
        run: npm run licenses:check
