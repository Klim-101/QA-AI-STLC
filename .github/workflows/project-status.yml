name: Project status

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  # pull_request_target runs with the base branch code and never checks out pull request code,
  # which keeps the project token safe for pull requests from forks.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
  create:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: project-status-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Klim-101/QA-AI-STLC' && vars.PROJECT_NUMBER != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Sync board status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const { syncProjectStatus } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/project-status.mjs`);
            await syncProjectStatus({
              github,
              context,
              core,
              projectOwner: context.repo.owner,
              projectNumber: Number(process.env.PROJECT_NUMBER),
            });
