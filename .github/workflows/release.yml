name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # For npm provenance (AGENTS.md 8.4): OIDC-signed attestation that a package was built by this
  # workflow from this commit, not typed and pushed by hand.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create a Version Packages pull request, or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npm run release
          # Bumping `packages/mcp-server`'s version without regenerating keeps the Claude Code
          # plugin (`adapters/claude-plugin/`) pinned to a stale version, and `lint:generated`
          # (#308) then fails on this PR's own branch. `npm run generate` needs no build first:
          # it reads `packages/mcp-server/package.json` directly.
          version-script: npx changeset version && npm run generate
          commit-message: 'chore(repo): version packages'
          pr-title: 'chore(repo): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
