name: Roadmap sync

on:
  milestone:
    types: [created, edited, closed, opened, deleted]
  issues:
    types: [opened, closed, reopened, deleted, milestoned, demilestoned]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: roadmap-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'Klim-101/QA-AI-STLC'
    runs-on: ubuntu-latest
    env:
      SYNC_BRANCH: chore/roadmap-sync
      ROADMAP_PATH: docs/public/ROADMAP.md
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render progress table
        id: render
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { renderRoadmap } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/render-roadmap.mjs`);
            const changed = await renderRoadmap({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              roadmapPath: process.env.ROADMAP_PATH,
              today: new Date().toISOString().slice(0, 10),
            });
            core.setOutput('changed', String(changed));

      - name: Format with Prettier
        if: steps.render.outputs.changed == 'true'
        # The generated table is plain markdown; CI now runs `prettier --check .` (P0-07), so the
        # generated file has to match its formatting or every sync would fail that check.
        run: npx prettier --write "$ROADMAP_PATH"

      - name: Open and merge roadmap pull request
        if: steps.render.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$SYNC_BRANCH"
          git add "$ROADMAP_PATH"
          git commit -s -m 'chore(repo): sync roadmap progress'
          # Credentials are passed to this single git invocation via -c, matching what actions/checkout
          # does with persist-credentials, instead of writing the token into .git/config for the job.
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth_header" push --force origin "$SYNC_BRANCH"

          pr_number=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$SYNC_BRANCH" \
              --title 'chore(repo): sync roadmap progress' \
              --body 'Automated update of the roadmap progress table from milestones.'
          fi
          # --auto so this waits for the CI required status checks (P0-07) instead of failing
          # outright because they have not started yet; the change touches only the generated
          # section of the roadmap, so it needs no human review.
          gh pr merge "$SYNC_BRANCH" --squash --delete-branch --auto
