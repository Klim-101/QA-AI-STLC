name: Bug report
description: Something in the framework does not work as documented.
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Remove secrets, tokens, cookies, internal hostnames and personal data** from everything you paste or attach.
        Security vulnerabilities must be reported privately, see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Framework version or commit
      placeholder: '0.1.0 or a commit SHA'
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Agent host
      options:
        - Claude Code CLI
        - Claude Code desktop
        - Codex CLI
        - Codex desktop
        - CLI only (no agent host)
        - Other MCP-capable host
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 'node --version'
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Explorer and selector registry
        - Test design and approvals
        - Test generation and runner
        - Evidence and reports
        - Defect drafts
        - CLI
        - MCP server
        - Plugin or installation
        - Documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Use the demo app if the problem reproduces there.
      placeholder: |
        1. qa init
        2. qa explore --env staging
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of `qa doctor --json` and relevant redacted log excerpts.
      render: shell
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I removed secrets, tokens, cookies, internal hostnames and personal data from this report.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
