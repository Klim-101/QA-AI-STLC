version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot keeps the pins and version comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait after an action release before opening a PR, so a compromised or quickly yanked
    # release is caught upstream before it reaches this repository.
    cooldown:
      default-days: 10
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
    labels: ['area: repo']

  # Root directory covers the npm workspace: Dependabot resolves package.json in every
  # packages/* workspace from the root lockfile (AGENTS.md 5.7: exact versions, allowlisted
  # licenses checked in CI regardless of what Dependabot proposes).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 10
    groups:
      npm-dependencies:
        patterns: ['*']
    commit-message:
      prefix: build
    labels: ['area: repo']
    ignore:
      # typescript-eslint@8.70.0 declares a peerDependency of `typescript: >=4.8.4 <6.1.0`
      # (verified live: this exact major bump failed a real Dependabot run with "Error while
      # updating peer dependency"). Wait for typescript-eslint to support the new major before
      # proposing it; a coordinated bump of both is a manual decision, not an automated one.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
