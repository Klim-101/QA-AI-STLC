version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot keeps the pins and version comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait after an action release before opening a PR, so a compromised or quickly yanked
    # release is caught upstream before it reaches this repository.
    cooldown:
      default-days: 10
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
    labels: ['area: repo']

  # Root directory covers the npm workspace: Dependabot resolves package.json in every
  # packages/* workspace from the root lockfile (AGENTS.md 5.7: exact versions, allowlisted
  # licenses checked in CI regardless of what Dependabot proposes).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 10
    groups:
      npm-dependencies:
        patterns: ['*']
    commit-message:
      prefix: build
    labels: ['area: repo']
    ignore:
      # typescript-eslint@8.70.0 declares a peerDependency of `typescript: >=4.8.4 <6.1.0`
      # (verified live: this exact major bump failed a real Dependabot run with "Error while
      # updating peer dependency"). Wait for typescript-eslint to support the new major before
      # proposing it; a coordinated bump of both is a manual decision, not an automated one.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # The demo app's Kendo UI fixtures and the explorer's Kendo profile recognise widgets by the
      # DOM Kendo UI Core 2024.2.319 renders. Later releases render something they do not
      # recognise: 2024.4.1112 and 2026.3.812 each fail the Kendo explorer, widget and grid tests
      # when they are the only package changed, while the theme (14.5.0) and jQuery 3.7.1 pass.
      # Moving to a newer Kendo release is a change to the Kendo profile (P6-40, P6-41), so no
      # version of it is proposed automatically.
      - dependency-name: 'kendo-ui-core'
      # kendo-ui-core declares jquery "1.10.0 - 3.6"; a major jQuery release is outside that range.
      - dependency-name: 'jquery'
        update-types: ['version-update:semver-major']
