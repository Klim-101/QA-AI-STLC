version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot keeps the pins and version comments current.
  # The npm ecosystem is added together with the monorepo skeleton.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
    labels: ['area: repo']
