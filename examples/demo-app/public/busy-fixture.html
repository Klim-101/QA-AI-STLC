<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Busy indicator fixture</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      .k-loading-mask {
        position: fixed;
        inset: 0;
        background: rgb(255 255 255 / 70%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Busy indicator fixture</h1>
      <p>
        A loading mask covers the page while it initializes, and again after Refresh. The mask does not
        intercept clicks, so a click issued meanwhile reaches the button, which ignores it until the page is
        ready. Add
        <code>?hold=1</code> to keep the mask forever.
      </p>
      <button type="button" id="save">Save</button>
      <button type="button" id="refresh">Refresh</button>
      <p id="save-status" role="status">Not saved.</p>
    </main>
    <script src="/busy-fixture.js"></script>
  </body>
</html>
